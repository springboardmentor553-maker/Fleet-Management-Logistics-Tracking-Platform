services:

  postgres:
    image: postgres:16
    container_name: fleetflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: fleetflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: fleetflow-redis
    ports:
      - "6379:6379"

  backend:
    image: fleetflow-backend:latest
    container_name: fleetflow-backend
    environment:
      DATABASE_URL: postgresql://postgres:12345@postgres:5432/fleetflow
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    image: fleetflow-backend:latest
    container_name: fleetflow-celery-worker
    environment:
      DATABASE_URL: postgresql://postgres:12345@postgres:5432/fleetflow
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    image: fleetflow-backend:latest
    container_name: fleetflow-celery-beat
    environment:
      DATABASE_URL: postgresql://postgres:12345@postgres:5432/fleetflow
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: fleetflow-frontend:latest
    container_name: fleetflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: