services:

  postgres:
    image: postgres:16
    container_name: fleetflow-postgres

    environment:
      POSTGRES_DB: fleetflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleetflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: fleetflow-backend

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: fleetflow-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  postgres_data: