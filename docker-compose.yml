services:

  postgres:
    image: postgres:16
    container_name: fleetflow-postgres

    environment:
      POSTGRES_DB: fleetflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleetflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: fleetflow-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


  backend:
    build:
      context: ./FleetManagementBackend
      dockerfile: Dockerfile

    container_name: fleetflow-backend

    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      APP_NAME: FleetFlow API
      ENV: production
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped


  celery:
    build:
      context: ./FleetManagementBackend
      dockerfile: Dockerfile

    container_name: fleetflow-celery

    command: celery -A app.celery.celery_app worker --loglevel=info

    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      APP_NAME: FleetFlow API
      ENV: production
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped


  celery-beat:
    build:
      context: ./FleetManagementBackend
      dockerfile: Dockerfile

    container_name: fleetflow-celery-beat

    command: celery -A app.celery.celery_app beat --loglevel=info

    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      APP_NAME: FleetFlow API
      ENV: production
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped


  frontend:
    build:
      context: ./FleetFlowFrontend
      dockerfile: Dockerfile

    container_name: fleetflow-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  postgres_data:
  redis_data: