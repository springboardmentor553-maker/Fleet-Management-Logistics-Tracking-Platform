services:

  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:
    image: postgres:16-alpine

    container_name: fleetflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # REDIS
  # ==========================================================

  redis:
    image: redis:7-alpine

    container_name: fleetflow-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # BACKEND
  # ==========================================================

  backend:
    build:
      context: ./backend

    container_name: fleetflow-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

    ports:
      - "8000:8000"

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
      ]


  # ==========================================================
  # CELERY WORKER
  # ==========================================================

  celery-worker:
    build:
      context: ./backend

    container_name: fleetflow-celery-worker

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery",
        "worker",
        "--loglevel=info"
      ]


  # ==========================================================
  # CELERY BEAT
  # ==========================================================

  celery-beat:
    build:
      context: ./backend

    container_name: fleetflow-celery-beat

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery",
        "beat",
        "--loglevel=info"
      ]


  # ==========================================================
  # FRONTEND
  # ==========================================================

  frontend:
    build:
      context: ./frontend

    container_name: fleetflow-frontend

    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


# ============================================================
# VOLUMES
# ============================================================

volumes:

  postgres_data:

  redis_data: